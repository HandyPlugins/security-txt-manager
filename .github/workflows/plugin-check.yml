name: Plugin Check

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Install NPM dependencies
        run: npm ci --no-audit

      - name: Build assets
        run: npm run build

      - name: Setup Plugin Check environment
        run: |
          PLUGIN_DIR=$(pwd)
          cat > .wp-env.json <<JSON
          {
            "core": null,
            "port": 8880,
            "testsPort": 8881,
            "plugins": [
              "https://downloads.wordpress.org/plugin/plugin-check.latest-stable.zip"
            ],
            "mappings": {
              "wp-content/plugins/security-txt-manager": "$PLUGIN_DIR"
            }
          }
          JSON
          npm -g --no-fund install @wordpress/env

      - name: Start WordPress environment
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: wp-env start --update

      - name: Run Plugin Check
        env:
          PLUGIN_SLUG: security-txt-manager
          EXCLUDE_DIRECTORIES: node_modules,vendor,.git,.github,.wordpress-org,.husky,tests
          EXCLUDE_FILES: .browserslistrc,.distignore,.editorconfig,.eslintignore,.eslintrc.json,.gitignore,.lintstagedrc.json,.npmrc,.nvmrc,.stylelintignore,.stylelintrc,babel.config.js,composer.json,composer.lock,lerna.json,package.json,package-lock.json,phpcs.xml,phpunit.xml,postcss.config.js,webpack.config.js,.gitkeep,.wp-env.json
        run: |
          wp-env run cli wp cli info
          wp-env run cli wp plugin list
          wp-env run cli wp plugin activate "$PLUGIN_SLUG"

          set +e
          wp-env run cli wp plugin check "$PLUGIN_SLUG" \
            --format=json \
            --exclude-directories="$EXCLUDE_DIRECTORIES" \
            --exclude-files="$EXCLUDE_FILES" \
            --require=./wp-content/plugins/plugin-check/cli.php \
            | tee "$RUNNER_TEMP/plugin-check-results.json"
          status=${PIPESTATUS[0]}
          set -e

          exit "$status"

      - name: Upload Plugin Check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-check-results
          path: ${{ runner.temp }}/plugin-check-results.json
          if-no-files-found: ignore

      - name: Stop WordPress environment
        if: always()
        run: wp-env stop || true
